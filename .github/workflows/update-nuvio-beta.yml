name: Update Nuvio

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-nuvio
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Update bundled app
        run: npm run update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app icon.png package.json .nuvio-beta-version
          if git diff --cached --quiet; then
            echo "No Nuvio update found."
          else
            VERSION="$(cat .nuvio-beta-version)"
            git commit -m "Bundle Nuvio ${VERSION} for TizenBrew"
            git push
          fi
