name: Update Nuvio

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-nuvio
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Update bundled app
        run: npm run update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Point TorBox at LAN proxy
        run: |
          sed -i 's#https://api.torbox.app/#http://192.168.0.182:8097/#g' app/app.bundle.js
          grep -q 'http://192.168.0.182:8097/' app/app.bundle.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app icon.png package.json .nuvio-beta-version
          if git diff --cached --quiet; then
            echo "No Nuvio update found."
          else
            VERSION="$(cat .nuvio-beta-version)"
            git commit -m "Bundle Nuvio ${VERSION} for TizenBrew"
            git push
          fi

      # TizenBrew reads appName/version from jsDelivr, which caches package.json for up to 12h.
      - name: Refresh jsDelivr package.json
        if: always()
        run: curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}/package.json" > /dev/null || echo "jsDelivr purge failed (non-fatal)."
